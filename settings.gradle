pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            url = 'https://repository.axelor.com/nexus/repository/maven-public/'
        }
    }
    plugins {
        id 'com.axelor.app' version '8.2.3'
        id 'com.github.node-gradle.node' version '7.1.0'
    }
}

plugins {
    id 'com.github.node-gradle.node' version '7.1.0' apply false
}
rootProject.name = 'my-custom-system'

include 'modules:my-module'
include 'modules:axelor-egypt-einvoice'

