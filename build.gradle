tasks.withType(JavaExec) {
    systemProperty "tomcat.util.scan.StandardJarScanFilter.jarsToSkip", "*"
    systemProperty "org.apache.catalina.startup.ContextConfig.jarsToSkip", "*"
}

tasks.named("generateRunner") {
    doLast {
        def propsFile = file("${buildDir}/tomcat/axelor-tomcat.properties")
        if (propsFile.exists()) {
            println "Patching axelor-tomcat.properties to optimize Tomcat on Windows..."
            def props = new Properties()
            propsFile.withInputStream { props.load(it) }
            
            def extraClasses = props.getProperty("extraClasses", "")
            if (extraClasses) {
                def parts = extraClasses.split(",")
                def kept = []
                if (parts.length > 0) kept.add(parts[0])
                if (parts.length > 1) kept.add(parts[1])
                props.setProperty("extraClasses", kept.join(","))
            }
            
            propsFile.withOutputStream { props.store(it, null) }
            println "Successfully patched axelor-tomcat.properties! Kept only root project directories."
        }
    }
}

